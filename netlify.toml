# Instellingen voor Netlify: die leest dit bestand automatisch.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# De service worker moet altijd vers zijn, anders blijven telefoons een oude versie gebruiken.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
